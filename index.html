<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>화학 전지 시뮬레이터</title>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&family=STIX+Two+Text:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f7fb; --card:#ffffff; --line:#e2e8f0; --ink:#1e293b; --sub:#64748b;
  --blue:#2563eb; --blue-soft:#eff6ff; --blue-line:#bfdbfe; --e:#0ea5e9;
  --ox:#dc2626; --red:#2563eb;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nanum Gothic',sans-serif;}
.chem{font-family:'STIX Two Text',Georgia,serif;}
.wrap{max-width:1380px;margin:0 auto;padding:18px 16px 28px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
h1{font-size:23px;margin:0;font-weight:800;letter-spacing:-.3px}
h1 small{display:block;font-size:13px;color:var(--sub);font-weight:400;margin-top:5px;letter-spacing:0}
.tabs{display:flex;background:#e2e8f0;padding:4px;border-radius:14px;gap:4px}
.tab{border:0;background:transparent;padding:10px 20px;border-radius:10px;font:inherit;font-size:15px;font-weight:800;color:var(--sub);cursor:pointer;transition:.15s}
.tab.on{background:#fff;color:var(--blue);box-shadow:0 1px 4px rgba(15,23,42,.12)}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:16px;align-items:start}
@media(max-width:1050px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 2px 10px rgba(15,23,42,.04)}
.stage{padding:10px}
canvas{width:100%;height:auto;display:block;border-radius:12px;background:#fff}
.controls{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:12px 8px 6px;border-top:1px solid var(--line);margin-top:10px}
.btn{border:1px solid var(--blue-line);background:var(--blue-soft);color:var(--blue);font:inherit;font-weight:700;font-size:14px;padding:8px 14px;border-radius:10px;cursor:pointer;transition:.15s}
.btn:hover{background:#dbeafe}
.btn.solid{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn.solid:hover{background:#1d4ed8}
.ctl{display:flex;align-items:center;gap:8px;font-size:14px;color:#334155}
.ctl input[type=range]{width:120px;accent-color:var(--blue)}
.tog{display:flex;align-items:center;gap:6px;font-size:14px;color:#334155;cursor:pointer;user-select:none;padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:#fff}
.tog input{accent-color:var(--blue);width:16px;height:16px;margin:0}
.sep{width:1px;height:26px;background:var(--line)}
.only-volta,.only-daniell{display:none}
body.m-volta .only-volta{display:flex}
body.m-daniell .only-daniell{display:flex}
.panel{padding:16px 16px 10px}
.sec{margin-bottom:16px}
.sec-title{font-size:13px;font-weight:800;color:var(--sub);margin-bottom:8px;display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.sec-title .hint{font-weight:400;font-size:12px;color:#94a3b8}
.overall{background:var(--blue-soft);border:1px solid var(--blue-line);border-radius:14px;padding:12px 14px;text-align:center}
.overall .eq{font-size:21px;color:#1e3a8a}
.overall .note{font-size:12.5px;color:#475569;margin-top:6px;line-height:1.5}
.step{border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px;cursor:pointer;transition:.15s;background:#fff}
.step:hover{border-color:var(--blue-line);background:#fafcff}
.step.on{border-color:#8b5cf6;background:#f5f3ff;box-shadow:0 0 0 3px rgba(139,92,246,.12)}
.step .top{display:flex;align-items:center;gap:8px}
.step .num{width:22px;height:22px;border-radius:50%;background:var(--blue);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.step.on .num{background:#8b5cf6}
.step .tag{font-size:11.5px;font-weight:800;padding:2px 8px;border-radius:999px;background:#f1f5f9;color:#475569}
.step .tag.ox{background:#fee2e2;color:#b91c1c}
.step .tag.re{background:#dbeafe;color:#1d4ed8}
.step .tag.br{background:#ede9fe;color:#6d28d9}
.step .ttl{font-weight:800;font-size:14px;margin-top:6px}
.step .eq{font-size:16.5px;color:#0f172a;margin:4px 0 2px}
.step .body{font-size:13px;color:#475569;line-height:1.55;display:none;margin-top:4px}
.step.on .body{display:block}
.cnt-group{margin-bottom:8px}
.cnt-head{font-size:12.5px;font-weight:700;color:#334155;margin:6px 0 4px}
.row{display:grid;grid-template-columns:56px 1fr 30px 54px;align-items:center;gap:8px;margin:5px 0;font-size:13px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:14.5px}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.bar{height:10px;background:#f1f5f9;border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;transition:width .25s}
.row .n{font-weight:800;text-align:right;font-variant-numeric:tabular-nums}
.row .n0{color:#94a3b8;font-size:11.5px}
.meta{font-size:13px;color:#334155;line-height:1.7;background:#f8fafc;border-radius:12px;padding:8px 12px;margin-top:8px}
.meta b{font-variant-numeric:tabular-nums}
.meter{display:flex;align-items:center;gap:8px;font-size:13px;margin-top:6px}
.meter .bar{flex:1;height:12px}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px}
.legend span{display:inline-flex;align-items:center;gap:5px}
</style>
</head>
<body class="m-volta">
<div class="wrap">
  <header>
    <h1>화학 전지 시뮬레이터 <small>전자와 이온이 어떻게 이동하는지 관찰해 봅시다</small></h1>
    <div class="tabs">
      <button class="tab on" data-mode="volta">볼타 전지</button>
      <button class="tab" data-mode="daniell">다니엘 전지</button>
    </div>
  </header>

  <div class="grid">
    <div class="card stage">
      <canvas id="cv"></canvas>
      <div class="controls">
        <button class="btn solid" id="bPlay">❚❚ 일시정지</button>
        <button class="btn" id="bReset">↺ 처음으로</button>
        <button class="btn" id="bOne">반응 1번 ▶</button>
        <label class="tog"><input type="checkbox" id="cAuto" checked> 자동 반응</label>
        <div class="ctl">속도 <input type="range" id="rSpeed" min="0.25" max="2" step="0.25" value="1"> <span id="lSpeed">1×</span></div>
        <div class="sep"></div>
        <label class="tog"><input type="checkbox" id="cE" checked> 전자</label>
        <label class="tog"><input type="checkbox" id="cS" checked> <span class="chem">SO₄²⁻</span>&nbsp;(구경꾼 이온)</label>
        <label class="tog"><input type="checkbox" id="cI"> 전류 방향</label>
        <div class="sep"></div>
        <label class="tog only-volta"><input type="checkbox" id="cPolar"> 분극 현상</label>
        <button class="btn only-volta" id="bShake">구리판 기포 제거</button>
        <label class="tog only-daniell"><input type="checkbox" id="cBridge" checked> 염다리 연결</label>
      </div>
    </div>

    <div class="card panel">
      <div class="sec">
        <div class="sec-title">전체 반응</div>
        <div class="overall"><div class="eq chem" id="overall"></div><div class="note" id="overallNote"></div></div>
      </div>
      <div class="sec">
        <div class="sec-title">무슨 일이 일어날까? <span class="hint">카드를 누르면 그림에 위치가 표시돼요</span></div>
        <div id="steps"></div>
      </div>
      <div class="sec">
        <div class="sec-title">입자 수 변화</div>
        <div id="counts"></div>
        <div class="meta" id="meta"></div>
        <div class="meter">전류 세기 <div class="bar"><i id="curBar" style="background:linear-gradient(90deg,#fde68a,#f59e0b);width:0"></i></div></div>
      </div>
      <div class="sec">
        <div class="sec-title">범례</div>
        <div class="legend" id="legend"></div>
      </div>
    </div>
  </div>
</div>

<script>
/* ================= 기본 설정 ================= */
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const W=1000, H=600;
const CHEM='"STIX Two Text", Georgia, serif', UI='"Nanum Gothic", sans-serif';
function fit(){const d=Math.min(window.devicePixelRatio||1,2.5);cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);}
fit(); addEventListener('resize',fit);

const ION={
  'Zn2+':{label:'Zn²⁺',r:14,fs:12,c1:'#e7e7ea',c2:'#4b4b55',tc:'#fff',dot:'#71717a'},
  'Cu2+':{label:'Cu²⁺',r:14,fs:12,c1:'#fed7aa',c2:'#c2410c',tc:'#fff',dot:'#ea7a2a'},
  'H+':  {label:'H⁺', r:10,fs:11,c1:'#ffffff',c2:'#94a3b8',tc:'#0f172a',dot:'#cbd5e1'},
  'SO42-':{label:'SO₄²⁻',r:14,fs:9.5,c1:'#f8fafc',c2:'#a3b0c2',tc:'#334155',dot:'#a3b0c2',spect:true},
  'K+':  {label:'K⁺', r:11,fs:10.5,c1:'#e9d5ff',c2:'#7c3aed',tc:'#fff',dot:'#8b5cf6'},
  'Cl-': {label:'Cl⁻',r:11,fs:10.5,c1:'#bbf7d0',c2:'#15803d',tc:'#fff',dot:'#22a35a'},
};
const WIRE_Y=95, BULB={x:500,y:66};

const opts={running:true,auto:true,speed:1,showE:true,showS:true,showI:false,polar:false,bridge:true};
let mode='volta', S=null, hl=0;

/* ================= 유틸 ================= */
const rnd=(a,b)=>a+Math.random()*(b-a);
function mkPath(pts){const cum=[0];for(let i=1;i<pts.length;i++)cum.push(cum[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));return{pts,cum,L:cum[cum.length-1]};}
function ptAt(P,s){if(s<=0)return P.pts[0];if(s>=P.L)return P.pts[P.pts.length-1];
  let i=1;while(P.cum[i]<s)i++;const a=P.pts[i-1],b=P.pts[i],k=(s-P.cum[i-1])/(P.cum[i]-P.cum[i-1]);return[a[0]+(b[0]-a[0])*k,a[1]+(b[1]-a[1])*k];}
function solid(c){const[r,g,b,a]=c;return`rgb(${Math.round(255+(r-255)*a)},${Math.round(255+(g-255)*a)},${Math.round(255+(b-255)*a)})`;}
function rgba(c){return`rgba(${c[0]},${c[1]},${c[2]},${c[3]})`;}
function rrect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function txt(s,x,y,o={}){ctx.save();ctx.font=`${o.w||700} ${o.size||16}px ${o.font||UI}`;ctx.fillStyle=o.color||'#1e293b';ctx.textAlign=o.align||'center';ctx.textBaseline=o.base||'middle';
  if(o.halo){ctx.lineWidth=4;ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineJoin='round';ctx.strokeText(s,x,y);}ctx.fillText(s,x,y);ctx.restore();}
function arrow(x1,y1,x2,y2,color,w=3,head=9){const a=Math.atan2(y2-y1,x2-x1);ctx.save();ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=w;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2-Math.cos(a)*head*.6,y2-Math.sin(a)*head*.6);ctx.stroke();
  ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-head*Math.cos(a-.45),y2-head*Math.sin(a-.45));ctx.lineTo(x2-head*Math.cos(a+.45),y2-head*Math.sin(a+.45));ctx.closePath();ctx.fill();ctx.restore();}

/* ================= 장면 구성 ================= */
function makeScene(kind){
  const s={kind,particles:[],events:[],bubbles:[],pits:[],deposits:[],floats:[],arrivals:[],t:0,acc:0.6,eCount:0,znOut:0,cuIn:0,bright:0,cur:0};
  if(kind==='volta'){
    s.vessels=[{x:165,y:200,w:670,h:360,lt:295,liq:[150,198,232,0.34],style:'tank'}];
    s.regions=[{x1:178,y1:303,x2:822,y2:549}];
    s.anode={x:300,y:155,w:46,bottom:500,metal:'Zn',v:0};
    s.cathode={x:654,y:155,w:46,bottom:500,metal:'Cu',v:0};
    s.init={'H+':20,'SO42-':10,'Zn2+':0};
    for(let i=0;i<20;i++)addIon(s,'H+',0);
    for(let i=0;i<10;i++)addIon(s,'SO42-',0);
  }else{
    s.vessels=[{x:105,y:235,w:330,h:325,lt:325,liq:[200,212,226,0.22],style:'beaker'},
               {x:565,y:235,w:330,h:325,lt:325,liq:[37,130,215,0.42],style:'beaker'}];
    s.regions=[{x1:116,y1:333,x2:424,y2:549},{x1:576,y1:333,x2:884,y2:549}];
    s.anode={x:185,y:155,w:44,bottom:515,metal:'Zn',v:0};
    s.cathode={x:771,y:155,w:44,bottom:515,metal:'Cu',v:1};
    // 염다리 경로
    const pts=[[360,482],[360,290]];
    for(let a=Math.PI;a<=2*Math.PI+1e-6;a+=Math.PI/36)pts.push([500+140*Math.cos(a),290+140*Math.sin(a)]);
    pts.push([640,290],[640,482]);
    s.bridgePath=mkPath(pts);
    s.init={'Zn2+':4,'SO42-L':4,'Cl-':0,'Cu2+':8,'SO42-R':8,'K+':0};
    for(let i=0;i<4;i++)addIon(s,'Zn2+',0);
    for(let i=0;i<4;i++)addIon(s,'SO42-',0);
    for(let i=0;i<8;i++)addIon(s,'Cu2+',1);
    for(let i=0;i<8;i++)addIon(s,'SO42-',1);
  }
  return s;
}
function obstacles(s){
  const o=[], A=s.anode, C=s.cathode;
  o.push({x1:A.x,y1:A.y,x2:A.x+A.w,y2:A.bottom},{x1:C.x,y1:C.y,x2:C.x+C.w,y2:C.bottom});
  if(s.kind==='daniell'&&opts.bridge)o.push({x1:341,y1:290,x2:379,y2:484},{x1:621,y1:290,x2:659,y2:484});
  return o;
}
function insideObs(x,y,r,obs){return obs.some(o=>x>o.x1-r&&x<o.x2+r&&y>o.y1-r&&y<o.y2+r);}
function addIon(s,type,reg){
  const R=s.regions[reg], r=ION[type].r, obs=obstacles(s);
  let x,y,ok=false;
  for(let k=0;k<300&&!ok;k++){
    x=rnd(R.x1+r,R.x2-r);y=rnd(R.y1+r,R.y2-r);
    ok=!insideObs(x,y,r+3,obs)&&!s.particles.some(p=>p.reg===reg&&Math.hypot(p.x-x,p.y-y)<p.r+r+4);
  }
  const p={type,x,y,vx:rnd(-10,10),vy:rnd(-10,10),r,reg,state:'free'};
  s.particles.push(p);return p;
}

/* ================= 반응 이벤트 ================= */
function segHits(x1,y1,x2,y2,o,r){for(let i=1;i<20;i++){const t=i/20,x=x1+(x2-x1)*t,y=y1+(y2-y1)*t;if(x>o.x1-r&&x<o.x2+r&&y>o.y1-r&&y<o.y2+r)return true;}return false;}
function route(s,p,tx,ty){
  const obs=obstacles(s);
  for(const o of obs){
    if(segHits(p.x,p.y,tx,ty,o,p.r)){
      const yy=Math.min(o.y2+p.r+8, s.regions[p.reg].y2-p.r);
      const side=tx>o.x2?o.x2+p.r+8:o.x1-p.r-8;
      return[[p.x,yy],[side,yy],[tx,ty]];
    }
  }
  return[[tx,ty]];
}
function startEvent(s){
  if(s.kind==='daniell'&&!opts.bridge)return false;
  const A=s.anode,C=s.cathode,lt=s.vessels[A.v].lt, ltC=s.vessels[C.v].lt;
  const need=s.kind==='volta'?2:1, ionType=s.kind==='volta'?'H+':'Cu2+';
  // 환원될 이온 고르기 (구리판과 같은 쪽에 있는 이온)
  let side=Math.random()<0.5?-1:1, cands=null;
  for(let tries=0;tries<2;tries++){
    const sd=tries?-side:side;
    const c=s.particles.filter(p=>p.type===ionType&&p.state==='free'&&(sd<0?p.x<C.x:p.x>C.x+C.w));
    if(c.length>=need){side=sd;cands=c;break;}
  }
  if(!cands)return false;
  const cy=rnd(ltC+30,C.bottom-18), cx=side<0?C.x:C.x+C.w;
  cands.sort((a,b)=>Math.hypot(a.x-cx,a.y-cy)-Math.hypot(b.x-cx,b.y-cy));
  const ions=cands.slice(0,need);
  const off=need===2?[-10,10]:[0];
  ions.forEach((p,i)=>{p.state='target';p.wps=route(s,p,cx+side*(p.r+2),cy+off[i]);p.arrived=false;});

  // 산화: 아연판에서 Zn²⁺ 생성
  const aside=Math.random()<0.5?-1:1, ay=rnd(lt+25,A.bottom-16), ax=aside<0?A.x:A.x+A.w;
  s.pits.push({y:ay,side:aside});
  const z=addIon(s,'Zn2+',A.v); z.x=ax+aside*(z.r+2); z.y=ay; z.vx=aside*55; z.vy=rnd(-8,8); z.state='emerge'; z.life=0.9;
  s.znOut++;
  s.floats.push({x:ax+aside*34,y:ay-22,text:'산화',color:'#dc2626',t:0});

  // 전자 2개: 아연판 → 도선 → 구리판
  const acx=A.x+A.w/2, ccx=C.x+C.w/2;
  const els=[0,1].map(i=>{
    const ey=cy+(i?6:-6);
    const P=mkPath([[ax,ay],[acx,ay],[acx,A.y+4],[acx,WIRE_Y],[BULB.x,WIRE_Y],[ccx,WIRE_Y],[ccx,C.y+4],[ccx,ey],[cx-side*5,ey]]);
    return{P,s:0,delay:i*0.32,arrived:false};
  });
  const ev={ions,els,cx,cy,side,done:false};
  s.events.push(ev);

  // 염다리 이온 이동 (다니엘 전지): Zn²⁺ 1개 생성될 때 Cl⁻ 2개는 (−)극 쪽, K⁺ 2개는 (+)극 쪽으로
  if(s.kind==='daniell'){
    const L=s.bridgePath.L;
    for(let i=0;i<2;i++){
      s.particles.push({type:'Cl-',r:ION['Cl-'].r,state:'bridge',bs:L*(0.47-i*0.05),dir:-1,x:0,y:0,vx:0,vy:0,reg:0});
      s.particles.push({type:'K+',r:ION['K+'].r,state:'bridge',bs:L*(0.53+i*0.05),dir:1,x:0,y:0,vx:0,vy:0,reg:1});
    }
  }
  return true;
}
function completeEvent(s,ev){
  ev.done=true;
  s.particles=s.particles.filter(p=>!ev.ions.includes(p));
  if(s.kind==='volta'){
    s.bubbles.push({x:ev.cx+ev.side*9,y:ev.cy,r:7.5,side:ev.side,attached:true,age:0,vy:0,ph:Math.random()*6});
  }else{
    s.deposits.push({y:ev.cy,side:ev.side});
    s.cuIn++;
  }
  s.floats.push({x:ev.cx+ev.side*40,y:ev.cy-22,text:'환원',color:'#2563eb',t:0});
}

/* ================= 시뮬레이션 진행 ================= */
function step(s,dt){
  s.t+=dt;
  const obs=obstacles(s);
  const attached=s.bubbles.filter(b=>b.attached).length;
  const cov=s.kind==='volta'&&opts.polar?Math.min(1,attached/6):0;
  s.cov=cov;

  // 자동 반응 생성
  if(opts.auto){
    let rate=0.9*(1-0.88*cov);
    s.acc+=dt*rate;
    if(s.acc>=1){
      if(s.events.length<3&&startEvent(s))s.acc-=1;
      else s.acc=Math.min(s.acc,1);
    }
  }

  // 전자 이동
  const halted=s.kind==='daniell'&&!opts.bridge;
  for(const ev of s.events){
    for(const e of ev.els){
      if(e.arrived||halted)continue;
      if(e.delay>0){e.delay-=dt;continue;}
      e.s+=230*dt;
      if(e.s>=e.P.L){e.s=e.P.L;e.arrived=true;s.eCount++;s.arrivals.push(s.t);}
    }
    if(ev.els.every(e=>e.arrived)&&ev.ions.every(p=>p.arrived))completeEvent(s,ev);
  }
  s.events=s.events.filter(e=>!e.done);

  // 입자 이동
  const L=s.bridgePath?s.bridgePath.L:0;
  for(const p of s.particles){
    const R=s.regions[p.reg];
    if(p.state==='bridge'){
      if(!opts.bridge)continue;
      p.bs+=p.dir*55*dt;
      if(p.bs<=0||p.bs>=L){
        const end=p.bs<=0?s.bridgePath.pts[0]:s.bridgePath.pts[s.bridgePath.pts.length-1];
        p.state='free';p.x=end[0];p.y=end[1]+p.r+6;p.vx=rnd(-12,12);p.vy=22;p.reg=p.bs<=0?0:1;
      }else{const q=ptAt(s.bridgePath,p.bs);p.x=q[0];p.y=q[1];}
      continue;
    }
    if(p.state==='target'){
      if(p.arrived)continue;
      const w=p.wps[0],dx=w[0]-p.x,dy=w[1]-p.y,d=Math.hypot(dx,dy),st=75*dt;
      if(d<=st){p.x=w[0];p.y=w[1];p.wps.shift();if(!p.wps.length)p.arrived=true;}
      else{p.x+=dx/d*st;p.y+=dy/d*st;}
      continue;
    }
    if(p.state==='emerge'){
      p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=Math.pow(0.25,dt);
      if(p.life<=0)p.state='free';
    }else{
      p.vx+=(Math.random()-.5)*130*dt;p.vy+=(Math.random()-.5)*130*dt;
      const sp=Math.hypot(p.vx,p.vy),m=20;if(sp>m){p.vx*=m/sp;p.vy*=m/sp;}
      p.x+=p.vx*dt;p.y+=p.vy*dt;
    }
    // 경계
    if(p.x<R.x1+p.r){p.x=R.x1+p.r;p.vx=Math.abs(p.vx);}
    if(p.x>R.x2-p.r){p.x=R.x2-p.r;p.vx=-Math.abs(p.vx);}
    if(p.y<R.y1+p.r){p.y=R.y1+p.r;p.vy=Math.abs(p.vy);}
    if(p.y>R.y2-p.r){p.y=R.y2-p.r;p.vy=-Math.abs(p.vy);}
    for(const o of obs){
      if(p.x>o.x1-p.r&&p.x<o.x2+p.r&&p.y>o.y1-p.r&&p.y<o.y2+p.r){
        const dl=p.x-(o.x1-p.r),dr=(o.x2+p.r)-p.x,dtp=p.y-(o.y1-p.r),db=(o.y2+p.r)-p.y,mn=Math.min(dl,dr,dtp,db);
        if(mn===dl){p.x=o.x1-p.r;p.vx=-Math.abs(p.vx);}else if(mn===dr){p.x=o.x2+p.r;p.vx=Math.abs(p.vx);}
        else if(mn===dtp){p.y=o.y1-p.r;p.vy=-Math.abs(p.vy);}else{p.y=o.y2+p.r;p.vy=Math.abs(p.vy);}
      }
    }
  }
  // 입자끼리 겹치지 않게
  const fr=s.particles.filter(p=>p.state==='free'||p.state==='emerge');
  for(let i=0;i<fr.length;i++)for(let j=i+1;j<fr.length;j++){
    const a=fr[i],b=fr[j];if(a.reg!==b.reg)continue;
    const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||0.01,m=a.r+b.r+1;
    if(d<m){const k=(m-d)/2/d;a.x-=dx*k;a.y-=dy*k;b.x+=dx*k;b.y+=dy*k;}
  }

  // 기포 (볼타 전지)
  const lt=s.vessels[0].lt;
  let att=s.bubbles.filter(b=>b.attached);
  if(opts.polar&&att.length>9)att[0].attached=false;
  for(const b of s.bubbles){
    b.age+=dt;
    if(b.attached){if(!opts.polar&&b.age>1.3)b.attached=false;}
    else{b.vy-=55*dt;b.y+=b.vy*dt;b.x+=Math.sin(b.age*7+b.ph)*12*dt+b.side*6*dt;}
  }
  s.bubbles=s.bubbles.filter(b=>{if(b.y<lt+b.r){s.floats.push({x:b.x,y:lt-14,text:'H₂↑',color:'#0369a1',t:0,chem:1});return false;}return true;});

  // 떠오르는 글자
  for(const f of s.floats){f.t+=dt;f.y-=14*dt;}
  s.floats=s.floats.filter(f=>f.t<1.4);

  // 전류(밝기)
  s.arrivals=s.arrivals.filter(t=>s.t-t<1.6);
  const cur=s.arrivals.length/1.6;
  s.cur+=(cur-s.cur)*Math.min(1,dt*2.5);
  s.bright=Math.min(1,s.cur/1.45);
}

/* ================= 그리기 ================= */
function vesselPath(v){const r=26;ctx.beginPath();ctx.moveTo(v.x,v.y);ctx.lineTo(v.x,v.y+v.h-r);ctx.quadraticCurveTo(v.x,v.y+v.h,v.x+r,v.y+v.h);
  ctx.lineTo(v.x+v.w-r,v.y+v.h);ctx.quadraticCurveTo(v.x+v.w,v.y+v.h,v.x+v.w,v.y+v.h-r);ctx.lineTo(v.x+v.w,v.y);}
function liquidColor(s,v,i){
  if(s.kind==='daniell'&&i===1){const n=s.particles.filter(p=>p.type==='Cu2+').length;const a=0.08+0.36*(n/8);return[37,130,215,a];}
  return v.liq;
}
function drawVessel(s,v,i){
  const c=liquidColor(s,v,i);v.cur=c;
  ctx.save();vesselPath(v);ctx.closePath();ctx.clip();
  ctx.fillStyle='rgba(241,245,249,.35)';ctx.fillRect(v.x,v.y,v.w,v.h);
  const g=ctx.createLinearGradient(0,v.lt,0,v.y+v.h);g.addColorStop(0,rgba(c));g.addColorStop(1,rgba([c[0],c[1],c[2],c[3]*0.55]));
  ctx.fillStyle=g;ctx.fillRect(v.x,v.lt,v.w,v.y+v.h-v.lt);
  ctx.strokeStyle=rgba([c[0]*0.8,c[1]*0.8,c[2]*0.9,Math.min(1,c[3]+0.25)]);ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(v.x,v.lt);ctx.lineTo(v.x+v.w,v.lt);ctx.stroke();
  ctx.restore();
  ctx.save();
  if(v.style==='tank'){ctx.strokeStyle='#6b6f76';ctx.lineWidth=9;}
  else{ctx.strokeStyle='rgba(100,116,139,.75)';ctx.lineWidth=3.5;}
  ctx.lineJoin='round';vesselPath(v);ctx.stroke();
  // 입구 테두리
  ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(v.x-10,v.y-2);ctx.lineTo(v.x,v.y+4);ctx.moveTo(v.x+v.w+10,v.y-2);ctx.lineTo(v.x+v.w,v.y+4);ctx.stroke();
  if(v.style==='beaker'){ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(v.x+14,v.y+30);ctx.lineTo(v.x+14,v.y+v.h-40);ctx.stroke();}
  ctx.restore();
}
function drawPlate(s,P,isAnode){
  const v=s.vessels[P.v], lt=v.lt, h=P.bottom-P.y;
  const g=ctx.createLinearGradient(P.x,0,P.x+P.w,0);
  if(P.metal==='Zn'){g.addColorStop(0,'#9aa1aa');g.addColorStop(.45,'#e7eaee');g.addColorStop(1,'#a3a8b0');}
  else{g.addColorStop(0,'#a8602c');g.addColorStop(.45,'#e9b07f');g.addColorStop(1,'#9c5a2c');}
  ctx.fillStyle=g;ctx.fillRect(P.x,P.y,P.w,h);
  // 석출된 구리
  if(!isAnode)for(const d of s.deposits){
    const x=d.side<0?P.x:P.x+P.w, gg=ctx.createRadialGradient(x-2,d.y-2,1,x,d.y,6.5);
    gg.addColorStop(0,'#f6c08e');gg.addColorStop(1,'#a8541f');ctx.fillStyle=gg;ctx.beginPath();ctx.arc(x,d.y,6.5,0,7);ctx.fill();
  }
  ctx.fillStyle=rgba(v.cur);ctx.fillRect(P.x,lt,P.w,P.bottom-lt);
  // 녹아 나간 자리(홈)
  if(isAnode){ctx.fillStyle=solid(v.cur);for(const p of s.pits){const x=p.side<0?P.x:P.x+P.w;ctx.beginPath();ctx.arc(x,p.y,7.5,0,7);ctx.fill();}}
  ctx.strokeStyle='rgba(0,0,0,.28)';ctx.lineWidth=1.2;ctx.strokeRect(P.x,P.y,P.w,h);
}
function drawBridge(s){
  const P=s.bridgePath;
  ctx.save();ctx.lineCap='butt';ctx.lineJoin='round';
  const path=()=>{ctx.beginPath();ctx.moveTo(...P.pts[0]);for(const q of P.pts.slice(1))ctx.lineTo(...q);};
  if(!opts.bridge){
    ctx.setLineDash([7,7]);ctx.strokeStyle='rgba(148,163,184,.7)';ctx.lineWidth=2;path();ctx.stroke();
    ctx.restore();txt('염다리 제거됨',500,230,{size:16,color:'#94a3b8'});return;
  }
  ctx.strokeStyle='#9aa6b6';ctx.lineWidth=42;path();ctx.stroke();
  ctx.strokeStyle='#eef2f7';ctx.lineWidth=34;path();ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=5;ctx.beginPath();
  for(let i=0;i<P.pts.length;i++){const q=P.pts[i];const nx=q[0]<500?-9:9;i?ctx.lineTo(q[0]+nx*0,q[1]-0):ctx.moveTo(q[0],q[1]);}
  ctx.restore();
  // 염다리 속 K⁺, Cl⁻ (배경)
  for(let i=0;i<14;i++){const t=0.06+i*0.0675,q=ptAt(P,P.L*t),k=i%2;
    txt(k?'K⁺':'Cl⁻',q[0],q[1],{size:12,font:CHEM,w:600,color:k?'rgba(124,58,237,.35)':'rgba(21,128,61,.35)'});}
  txt('염다리',500,226,{size:17});
  txt('(KCl)',500,248,{size:15,font:CHEM,color:'#475569',w:600});
}
function drawIon(p){
  const d=ION[p.type];
  if(d.spect&&!opts.showS)return;
  ctx.save();ctx.globalAlpha=d.spect?0.8:1;
  if(p.state==='emerge'){ctx.strokeStyle='rgba(220,38,38,.6)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x,p.y,d.r+4+3*Math.sin(p.life*10),0,7);ctx.stroke();}
  if(p.state==='target'){ctx.strokeStyle='rgba(37,99,235,.55)';ctx.setLineDash([3,3]);ctx.lineWidth=1.6;ctx.beginPath();ctx.arc(p.x,p.y,d.r+4,0,7);ctx.stroke();ctx.setLineDash([]);}
  const g=ctx.createRadialGradient(p.x-d.r*.35,p.y-d.r*.4,d.r*.12,p.x,p.y,d.r);
  g.addColorStop(0,d.c1);g.addColorStop(1,d.c2);
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,d.r,0,7);ctx.fill();
  ctx.fillStyle=d.tc;ctx.font=`600 ${d.fs}px ${CHEM}`;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(d.label,p.x,p.y+0.5);
  ctx.restore();
}
function drawElectron(x,y){
  ctx.save();ctx.fillStyle='#0ea5e9';ctx.strokeStyle='#fff';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.arc(x,y,6.5,0,7);ctx.fill();ctx.stroke();
  ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x-3,y);ctx.lineTo(x+3,y);ctx.stroke();ctx.restore();
}
function drawWires(s){
  const A=s.anode,C=s.cathode,acx=A.x+A.w/2,ccx=C.x+C.w/2;
  ctx.save();ctx.lineWidth=4;ctx.lineJoin='round';ctx.lineCap='round';
  ctx.strokeStyle='#1f2937';ctx.beginPath();ctx.moveTo(acx,A.y-14);ctx.lineTo(acx,WIRE_Y);ctx.lineTo(BULB.x-14,WIRE_Y);ctx.stroke();
  ctx.strokeStyle='#dc2626';ctx.beginPath();ctx.moveTo(BULB.x+14,WIRE_Y);ctx.lineTo(ccx,WIRE_Y);ctx.lineTo(ccx,C.y-14);ctx.stroke();
  ctx.restore();
  // 집게
  for(const [x,y,c] of [[acx,A.y,'#1f2937'],[ccx,C.y,'#b91c1c']]){ctx.fillStyle=c;rrect(x-6,y-22,12,26,4);ctx.fill();ctx.fillStyle='#d4d4d8';ctx.fillRect(x-1.5,y+2,3,7);}
  // 전구
  const b=s.bright;
  if(b>0.02){const gg=ctx.createRadialGradient(BULB.x,BULB.y,4,BULB.x,BULB.y,70);gg.addColorStop(0,`rgba(253,224,71,${0.75*b})`);gg.addColorStop(1,'rgba(253,224,71,0)');ctx.fillStyle=gg;ctx.beginPath();ctx.arc(BULB.x,BULB.y,70,0,7);ctx.fill();}
  ctx.fillStyle=`rgb(${Math.round(241+14*b)},${Math.round(245-5*b)},${Math.round(249-110*b)})`;
  ctx.strokeStyle='rgba(100,116,139,.8)';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(BULB.x,BULB.y-4,17,0,7);ctx.fill();ctx.stroke();
  ctx.strokeStyle=b>0.05?`rgba(234,88,12,${0.5+0.5*b})`:'#94a3b8';ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(BULB.x-6,BULB.y+4);ctx.lineTo(BULB.x-4,BULB.y-8);ctx.lineTo(BULB.x,BULB.y-3);ctx.lineTo(BULB.x+4,BULB.y-8);ctx.lineTo(BULB.x+6,BULB.y+4);ctx.stroke();
  const sg=ctx.createLinearGradient(BULB.x-10,0,BULB.x+10,0);sg.addColorStop(0,'#a16207');sg.addColorStop(.5,'#facc15');sg.addColorStop(1,'#a16207');
  ctx.fillStyle=sg;rrect(BULB.x-10,BULB.y+11,20,18,3);ctx.fill();
  ctx.strokeStyle='rgba(120,53,15,.5)';ctx.lineWidth=1;for(let k=0;k<3;k++){ctx.beginPath();ctx.moveTo(BULB.x-10,BULB.y+16+k*5);ctx.lineTo(BULB.x+10,BULB.y+14+k*5);ctx.stroke();}
  // 전자 이동 방향 표시
  const lx=(acx+BULB.x)/2, rx=(ccx+BULB.x)/2;
  for(const x of [lx,rx]){txt('e⁻',x-30,WIRE_Y-22,{size:19,font:CHEM,w:600,color:'#0f172a'});arrow(x-14,WIRE_Y-18,x+30,WIRE_Y-18,'#0ea5e9',3.5,10);}
  if(opts.showI){for(const x of [lx,rx]){arrow(x+30,WIRE_Y+16,x-14,WIRE_Y+16,'#f59e0b',3.5,10);txt('전류',x+8,WIRE_Y+33,{size:13,color:'#b45309'});}}
  // 극 표시
  txt('(−)극',acx-16,WIRE_Y+30,{size:19,align:'right'});
  txt('(+)극',ccx+16,WIRE_Y+30,{size:19,align:'left'});
}
function drawHighlight(s,now){
  if(!hl)return;
  const pulse=0.55+0.45*Math.sin(now*4);
  const A=s.anode,C=s.cathode,acx=A.x+A.w/2,ccx=C.x+C.w/2;
  const ell=(P)=>{const lt=s.vessels[P.v].lt,cx=P.x+P.w/2,cy=(lt+P.bottom)/2;ctx.beginPath();ctx.ellipse(cx,cy,64,(P.bottom-lt)/2+26,0,0,7);};
  ctx.save();ctx.strokeStyle=`rgba(139,92,246,${pulse})`;ctx.lineWidth=3.5;ctx.setLineDash([10,7]);
  const wire=()=>{ctx.save();ctx.setLineDash([]);ctx.strokeStyle=`rgba(250,204,21,${0.55*pulse})`;ctx.lineWidth=16;ctx.lineJoin='round';ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(acx,A.y);ctx.lineTo(acx,WIRE_Y);ctx.lineTo(ccx,WIRE_Y);ctx.lineTo(ccx,C.y);ctx.stroke();ctx.restore();};
  if(s.kind==='volta'){
    if(hl===1){ell(A);ctx.stroke();}
    if(hl===2)wire();
    if(hl===3||hl===5){ell(C);ctx.stroke();}
    if(hl===4){const R=s.regions[0];rrect(R.x1-4,R.y1-4,R.x2-R.x1+8,R.y2-R.y1+8,18);ctx.stroke();}
  }else{
    if(hl===1){ell(A);ctx.stroke();}
    if(hl===2)wire();
    if(hl===3){ell(C);ctx.stroke();}
    if(hl===4){const P=s.bridgePath;ctx.setLineDash([]);ctx.strokeStyle=`rgba(139,92,246,${0.35*pulse})`;ctx.lineWidth=58;ctx.lineJoin='round';
      ctx.beginPath();ctx.moveTo(...P.pts[0]);for(const q of P.pts.slice(1))ctx.lineTo(...q);ctx.stroke();}
  }
  ctx.restore();
}
function statusMsg(s){
  if(s.kind==='daniell'&&!opts.bridge)return'염다리를 빼면 회로가 끊겨 전자가 이동하지 않아요';
  const busy=s.events.length>0;
  if(s.kind==='volta'&&!busy&&s.particles.filter(p=>p.type==='H+').length<2)return'H⁺이 모두 소모되어 반응이 멈췄어요';
  if(s.kind==='daniell'&&!busy&&!s.particles.some(p=>p.type==='Cu2+'))return'Cu²⁺이 모두 소모되어 반응이 멈췄어요';
  if(s.kind==='volta'&&s.cov>=0.5)return'구리판이 H₂ 기포로 덮여 전류가 약해졌어요 (분극 현상)';
  if(!opts.auto&&!busy)return'‘반응 1번’을 눌러 한 단계씩 관찰해 보세요';
  if(!opts.running)return'일시정지';
  return'';
}
function draw(s,now){
  ctx.clearRect(0,0,W,H);ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);
  s.vessels.forEach((v,i)=>drawVessel(s,v,i));
  if(s.kind==='daniell')drawBridge(s);
  drawPlate(s,s.anode,true);drawPlate(s,s.cathode,false);
  for(const p of s.particles)if(p.state!=='bridge')drawIon(p);
  if(opts.bridge)for(const p of s.particles)if(p.state==='bridge')drawIon(p);
  // 기포
  for(const b of s.bubbles){ctx.save();ctx.fillStyle='rgba(255,255,255,.75)';ctx.strokeStyle='#38bdf8';ctx.lineWidth=1.6;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill();ctx.stroke();
    ctx.fillStyle='#0369a1';ctx.font=`600 8.5px ${CHEM}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('H₂',b.x,b.y+.5);ctx.restore();}
  drawWires(s);
  // 전자
  if(opts.showE)for(const ev of s.events)for(const e of ev.els){if(e.delay>0)continue;const q=ptAt(e.P,e.s);drawElectron(q[0],q[1]);}
  // 라벨
  const A=s.anode,C=s.cathode;
  txt('아연판',A.x-12,A.y+48,{size:17,align:'right'});
  txt('구리판',C.x+C.w+12,C.y+48,{size:17,align:'left'});
  if(s.kind==='volta'){txt('묽은 황산',500,582,{size:17});}
  else{txt('황산 아연 수용액',270,582,{size:17});txt('황산 구리(Ⅱ) 수용액',730,582,{size:17});}
  for(const f of s.floats){ctx.save();ctx.globalAlpha=Math.max(0,1-f.t/1.4);txt(f.text,f.x,f.y,{size:f.chem?15:15,font:f.chem?CHEM:UI,w:800,color:f.color,halo:1});ctx.restore();}
  drawHighlight(s,now);
  const m=statusMsg(s);
  if(m){ctx.save();ctx.font=`700 14px ${UI}`;const w=ctx.measureText(m).width+28;ctx.fillStyle='rgba(30,41,59,.85)';rrect(14,14,w,32,16);ctx.fill();ctx.restore();txt(m,28,30,{size:14,align:'left',color:'#fff'});}
}

      {tag:'(−)극 · 산화',cls:'ox',ttl:'아연판의 Zn이 전자를 잃어요',eq:'Zn → Zn²⁺ + 2e⁻',body:'아연 원자는 전자 2개를 아연판에 남기고 Zn²⁺이 되어 용액 속으로 녹아 들어가요. 그래서 아연판의 질량은 감소해요.'},
      {tag:'도선',cls:'',ttl:'전자는 도선을 따라 이동해요',eq:'아연판 → 도선 → 구리판',body:'아연판에 남은 전자는 도선을 따라 구리판으로 이동하고, 이때 전구에 불이 켜져요. 전류의 방향은 전자의 이동 방향과 반대예요.'},
      {tag:'(+)극 · 환원',cls:'re',ttl:'구리판 표면에서 H⁺이 전자를 얻어요',eq:'2H⁺ + 2e⁻ → H₂',body:'용액 속 H⁺이 구리판 표면에서 도선을 타고 온 전자를 얻어 수소 기체가 발생해요. 구리판 자체는 반응하지 않으므로 질량이 변하지 않아요.'},
      {tag:'용액',cls:'',ttl:'용액 속 이온 수의 변화',eq:'H⁺ 감소 · Zn²⁺ 증가 · SO₄²⁻ 일정',body:'H⁺ 2개가 줄어들 때 Zn²⁺ 1개가 늘어나요. SO₄²⁻은 반응에 참여하지 않는 구경꾼 이온이라 수가 변하지 않아요.'},
      {tag:'분극',cls:'br',ttl:'전구가 금방 어두워지는 까닭',eq:'구리판 표면이 H₂ 기포로 덮임',body:'발생한 H₂ 기포가 구리판 표면에 달라붙으면 H⁺이 구리판에서 전자를 얻기 어려워져 전류가 급격히 약해져요. 이를 분극 현상이라고 해요. 아래 ‘분극 현상’을 켜고 관찰해 보세요.'},
    ],
    counts:[{title:'묽은 황산',rows:[['H+',0],['Zn2+',0],['SO42-',0]]}],
    init:{'H+':20,'Zn2+':0,'SO42-':10}, scale:20,
    legend:['H+','Zn2+','SO42-'],
  },
  daniell:{
    overall:'Zn + Cu²⁺ → Zn²⁺ + Cu',
    note:'(+)극에서 H₂ 기체가 발생하지 않으므로 볼타 전지와 같은 분극 현상이 일어나지 않아요.',
    steps:[
      {tag:'(−)극 · 산화',cls:'ox',ttl:'아연판의 Zn이 전자를 잃어요',eq:'Zn → Zn²⁺ + 2e⁻',body:'아연 원자가 전자 2개를 잃고 Zn²⁺이 되어 황산 아연 수용액으로 녹아 들어가요. 아연판의 질량은 감소하고, 수용액 속 Zn²⁺ 수는 증가해요.'},
      {tag:'도선',cls:'',ttl:'전자는 도선을 따라 이동해요',eq:'아연판 → 도선 → 구리판',body:'전자는 도선을 따라 아연판에서 구리판으로 이동해요. 전류의 방향은 그 반대인 구리판 → 아연판이에요.'},
      {tag:'(+)극 · 환원',cls:'re',ttl:'구리판에서 Cu²⁺이 전자를 얻어요',eq:'Cu²⁺ + 2e⁻ → Cu',body:'수용액 속 Cu²⁺이 구리판 표면에서 전자를 얻어 구리로 석출돼요. 구리판의 질량은 증가하고, Cu²⁺ 수가 줄어 수용액의 푸른색이 점점 옅어져요.'},
      {tag:'염다리',cls:'br',ttl:'염다리 속 이온이 전하 균형을 맞춰요',eq:'Cl⁻ → (−)극 쪽 · K⁺ → (+)극 쪽',body:'아연 쪽 용액은 양이온(Zn²⁺)이 늘어나고, 구리 쪽 용액은 양이온(Cu²⁺)이 줄어들어요. 염다리의 음이온(Cl⁻)은 (−)극 쪽으로, 양이온(K⁺)은 (+)극 쪽으로 이동하여 두 용액의 전하 균형을 유지해요. 염다리를 빼면 전류가 흐르지 않아요.'},
    ],
    counts:[{title:'(−)극 쪽 · 황산 아연 수용액',rows:[['Zn2+',0],['SO42-',0],['Cl-',0]]},{title:'(+)극 쪽 · 황산 구리(Ⅱ) 수용액',rows:[['Cu2+',1],['SO42-',1],['K+',1]]}],
    init:{'Zn2+0':4,'SO42-0':4,'Cl-0':0,'Cu2+1':8,'SO42-1':8,'K+1':0}, scale:20,
    legend:['Zn2+','Cu2+','SO42-','K+','Cl-'],
  }
};
function buildPanel(){
  const D=DATA[mode];
  document.getElementById('overall').textContent=D.overall;
  document.getElementById('overallNote').textContent=D.note;
  document.getElementById('steps').innerHTML=D.steps.map((s,i)=>`
    <div class="step" data-k="${i+1}"><div class="top"><span class="num">${i+1}</span><span class="tag ${s.cls}">${s.tag}</span></div>
    <div class="ttl">${s.ttl}</div><div class="eq chem">${s.eq}</div><div class="body">${s.body}</div></div>`).join('');
  document.querySelectorAll('.step').forEach(el=>el.onclick=()=>{const k=+el.dataset.k;hl=hl===k?0:k;
    document.querySelectorAll('.step').forEach(e=>e.classList.toggle('on',+e.dataset.k===hl));});
  document.getElementById('counts').innerHTML=D.counts.map(g=>`<div class="cnt-group"><div class="cnt-head">${g.title}</div>${
    g.rows.map(([t,r])=>{const id=t+(mode==='daniell'?r:'');const n0=mode==='daniell'?D.init[id]:D.init[t];
      return`<div class="row"><span class="chip chem"><span class="dot" style="background:${ION[t].dot}"></span>${ION[t].label}</span>
      <div class="bar"><i id="b_${id}" style="background:${ION[t].dot}"></i></div><span class="n" id="n_${id}">0</span><span class="n0">처음 ${n0}</span></div>`;}).join('')}</div>`).join('');
  document.getElementById('legend').innerHTML=`<span><span class="dot" style="background:#0ea5e9"></span><span class="chem">e⁻</span>&nbsp;전자</span>`+
    D.legend.map(t=>`<span><span class="dot" style="background:${ION[t].dot}"></span><span class="chem">${ION[t].label}</span></span>`).join('')+
    (mode==='volta'?`<span><span class="dot" style="background:#fff;border:1.5px solid #38bdf8"></span><span class="chem">H₂</span>&nbsp;기포</span>`:'');
}
function updatePanel(){
  const D=DATA[mode];
  for(const g of D.counts)for(const [t,r] of g.rows){
    const id=t+(mode==='daniell'?r:'');
    const n=S.particles.filter(p=>p.type===t&&p.state!=='bridge'&&(mode==='volta'||p.reg===r)).length;
    document.getElementById('n_'+id).textContent=n;
    document.getElementById('b_'+id).style.width=Math.min(100,n/D.scale*100)+'%';
  }
  document.getElementById('meta').innerHTML= mode==='volta'
    ? `도선으로 이동한 전자: <b>${S.eCount}</b>개<br>아연판: 녹아 나간 Zn 원자 <b>${S.znOut}</b>개 → 질량 감소<br>구리판: 반응하지 않음 → 질량 변화 없음`
    : `도선으로 이동한 전자: <b>${S.eCount}</b>개<br>아연판: 녹아 나간 Zn 원자 <b>${S.znOut}</b>개 → 질량 감소<br>구리판: 석출된 Cu 원자 <b>${S.cuIn}</b>개 → 질량 증가`;
  document.getElementById('curBar').style.width=(S.bright*100)+'%';
}

/* ================= 조작 ================= */
function setMode(m){
  mode=m;hl=0;document.body.className='m-'+m;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.mode===m));
  reset();buildPanel();
}
function reset(){S=makeScene(mode);}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>setMode(t.dataset.mode));
const bPlay=document.getElementById('bPlay');
bPlay.onclick=()=>{opts.running=!opts.running;bPlay.textContent=opts.running?'❚❚ 일시정지':'▶ 재생';};
document.getElementById('bReset').onclick=()=>{reset();};
document.getElementById('bOne').onclick=()=>{
  if(!opts.running){opts.running=true;bPlay.textContent='❚❚ 일시정지';}
  if(S.events.length<3&&!startEvent(S)){S.floats.push({x:500,y:150,text:mode==='daniell'&&!opts.bridge?'염다리가 없어요':'반응할 이온이 없어요',color:'#64748b',t:0});}
};
document.getElementById('cAuto').onchange=e=>{opts.auto=e.target.checked;S.acc=0;};
document.getElementById('rSpeed').oninput=e=>{opts.speed=+e.target.value;document.getElementById('lSpeed').textContent=opts.speed+'×';};
document.getElementById('cE').onchange=e=>opts.showE=e.target.checked;
document.getElementById('cS').onchange=e=>opts.showS=e.target.checked;
document.getElementById('cI').onchange=e=>opts.showI=e.target.checked;
document.getElementById('cPolar').onchange=e=>{opts.polar=e.target.checked;};
document.getElementById('bShake').onclick=()=>{for(const b of S.bubbles)if(b.attached){b.attached=false;b.age=0;}};
document.getElementById('cBridge').onchange=e=>{opts.bridge=e.target.checked;
  if(!opts.bridge)S.particles=S.particles.filter(p=>p.state!=='bridge');};

/* ================= 루프 ================= */
setMode('volta');
let last=performance.now(), lastUI=0;
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  if(opts.running)step(S,dt*opts.speed);
  draw(S,now/1000);
  if(now-lastUI>150){updatePanel();lastUI=now;}
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
